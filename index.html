  <style>
:root {
  color-scheme: light;
  --paper: #f7f8f3;
  --panel: #f2f3ee;
  --ink: #191919;
  --muted: #64655f;
  --line: #d3d4cc;
  --gutter: clamp(18px, 5.6vw, 40px);
  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.4 var(--sans);
}

h1, h2, p, dl, dd, fieldset { margin: 0; }
img { display: block; max-width: 100%; height: auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 4px;
}

.shell {
  width: min(100%, 1280px);
  padding-inline: var(--gutter);
  margin-inline: auto;
}

.header {
  display: flex;
  align-items: center;
  min-height: 68px;
  padding-top: 24px;
}

.wordmark {
  display: inline-flex;
  align-items: flex-start;
  font-size: 30px;
  font-weight: 750;
  letter-spacing: -.075em;
  line-height: 1;
  text-decoration: none;
}

.wordmark sup {
  margin: 2px 0 0 3px;
  font-size: 10px;
  letter-spacing: 0;
  line-height: 1;
}

.intro {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--paper);
  pointer-events: none;
  animation: curtain 1.15s cubic-bezier(.76, 0, .24, 1) both;
}

.intro-brand {
  overflow: hidden;
  padding: 0 3px 12px;
}

.intro-brand .wordmark {
  font-size: clamp(52px, 13vw, 106px);
  animation: wordmark-in .5s cubic-bezier(.22, 1, .36, 1) both;
}

.intro-brand sup { font-size: .23em; }

.intro-brand::after {
  display: block;
  height: 1px;
  margin-top: 11px;
  background: currentColor;
  content: "";
  transform-origin: left center;
  animation: rule-in .4s .16s ease-out both;
}

@keyframes curtain {
  0%, 58% { transform: translateY(0); }
  100% { transform: translateY(-100%); visibility: hidden; }
}

@keyframes wordmark-in {
  from { clip-path: inset(0 0 100%); transform: translateY(20px); opacity: 0; }
  to { clip-path: inset(0); transform: translateY(0); opacity: 1; }
}

@keyframes rule-in {
  from { transform: scaleX(0); opacity: 0; }
  to { transform: scaleX(1); opacity: .65; }
}

.product {
  display: grid;
  justify-items: center;
  gap: 47px;
  padding: 53px 0 48px;
}

.product-gallery { width: min(100%, 524px); }

.gallery-frame {
  position: relative;
  aspect-ratio: 524 / 476;
}

.product-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: opacity .28s ease-in-out;
}

.product-photo[aria-hidden="true"] {
  opacity: 0;
  pointer-events: none;
}

.gallery-options {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
}

.gallery-options button {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}

.gallery-options button:hover {
  border-color: var(--muted);
  background: var(--panel);
}

.product-details {
  width: min(100%, 300px);
  text-align: center;
}

.eyebrow {
  color: var(--muted);
  font: 12px/1.4 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
}

.product h1 {
  font-size: clamp(24px, 6.8vw, 32px);
  font-weight: 400;
  line-height: 1.12;
  letter-spacing: -.045em;
}

.product-price {
  margin-top: 10px;
  font-size: 18px;
}

.sizes {
  margin: 28px 0 21px;
  padding: 0;
  border: 0;
}

.sizes legend {
  margin-inline: auto;
  padding: 0;
  color: var(--muted);
  font-size: 14px;
}

.size-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(44px, 1fr));
  width: min(100%, 244px);
  margin: 11px auto 0;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  -webkit-tap-highlight-color: transparent;
}

.size-options label { position: relative; cursor: pointer; }

.size-options input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.size-options span {
  display: grid;
  min-height: 44px;
  place-items: center;
  border-radius: 999px;
  font-size: 14px;
}

.size-options input:checked + span {
  background: var(--ink);
  color: var(--paper);
}

.size-options input:focus-visible + span {
  outline: 2px solid currentColor;
  outline-offset: -3px;
}

@supports (mix-blend-mode: difference) and selector(:has(input:checked)) {
  .size-options {
    --size-index: 0;
    position: relative;
    isolation: isolate;
  }

  .size-options:has(input[value="M"]:checked) { --size-index: 1; }
  .size-options:has(input[value="L"]:checked) { --size-index: 2; }
  .size-options:has(input[value="XL"]:checked) { --size-index: 3; }

  .size-options::before {
    position: absolute;
    inset: 4px auto 4px 4px;
    width: calc((100% - 8px) / 4);
    border-radius: inherit;
    background: var(--ink);
    pointer-events: none;
    content: "";
    transform: translateX(calc(100% * var(--size-index)));
    transition: transform .22s cubic-bezier(.22, 1, .36, 1);
  }

  /* The text inverts over the moving pill and stays dark over the track. */
  .size-options label {
    mix-blend-mode: difference;
    color: #fff;
  }

  .size-options input:checked + span {
    background: transparent;
    color: inherit;
  }
}

@media (forced-colors: active) {
  .size-options::before { display: none; }
  .size-options label { mix-blend-mode: normal; color: ButtonText; }
  .size-options input:checked + span {
    forced-color-adjust: none;
    background: Highlight;
    color: HighlightText;
  }
}

.primary {
  display: grid;
  width: 100%;
  min-height: 51px;
  place-items: center;
  padding: 12px 16px;
  border: 1px solid var(--ink);
  border-radius: 8px;
  background: var(--ink);
  color: var(--paper);
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  text-decoration: none;
}

.primary:hover { background: #343430; }
.primary[data-action="buy"] { border-radius: 16px; }

.order {
  position: fixed;
  width: min(calc(100% - 32px), 400px);
  max-height: calc(100% - 32px);
  padding: clamp(20px, 6vw, 30px);
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  color: var(--ink);
}

.order::backdrop { background: rgb(25 25 25 / .45); }

.order-close {
  position: absolute;
  top: 8px;
  right: 8px;
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
}

.order-close:hover { background: var(--line); }

.order h2 {
  margin-top: 8px;
  font-size: 27px;
  font-weight: 400;
  letter-spacing: -.04em;
}

.order h2:focus { outline: none; }

.order-summary {
  display: grid;
  gap: 8px;
  margin-top: 22px;
  padding-block: 14px;
  border-block: 1px solid var(--line);
  font-size: 14px;
}

.order-summary div { display: flex; justify-content: space-between; gap: 16px; }
.order-summary dt { color: var(--muted); }

.checkout {
  display: grid;
  gap: 10px;
  margin-top: 20px;
  font-size: 14px;
}

.checkout input {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--paper);
  font-size: 16px;
}

.checkout .primary { margin-top: 6px; }
.field-help { color: var(--muted); font-size: 12px; }
.checkout-status { padding-top: 8px; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  .intro { display: none; }
  .product-photo { transition: none; }
  .size-options::before { transition: none; }
}

@media (min-width: 760px) {
  .header { min-height: 75px; padding-top: 31px; }
  .header .wordmark { font-size: 37px; }

  .product {
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    align-items: center;
    width: min(100%, 1050px);
    margin-inline: auto;
    gap: clamp(32px, 6vw, 96px);
    padding-block: clamp(60px, 10vh, 128px);
  }

  .product-details { width: min(100%, 380px); }
  .product h1 { font-size: clamp(32px, 4vw, 48px); }
  .product-price { font-size: 22px; }
  .sizes { margin-top: 35px; }
  .size-options { width: min(100%, 268px); }
}
  </style>

          </button>
          <button type="button" data-photo-step="1" aria-controls="gallery-frame" aria-label="Следующее фото">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="product-details">
        <h1 id="product-title">horny alternative</h1>
        <p class="product-price">3 600 ₽</p>
        <fieldset class="sizes">
          <legend>Размер</legend>
          <div class="size-options">
            <label><input type="radio" name="size" value="S"><span>S</span></label>
            <label><input type="radio" name="size" value="M"><span>M</span></label>
            <label><input type="radio" name="size" value="L" checked><span>L</span></label>
            <label><input type="radio" name="size" value="XL"><span>XL</span></label>
          </div>
        </fieldset>
        <button class="primary" type="button" data-action="buy" aria-haspopup="dialog">Купить</button>
      </div>
    </section>

    <dialog class="order" id="order" aria-labelledby="order-title">
      <button class="order-close" id="order-close" type="button" aria-label="Закрыть окно заказа">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg>
      </button>
      <p class="eyebrow">Оформление заказа</p>
      <h2 id="order-title" tabindex="-1" autofocus>horny alternative</h2>
      <dl class="order-summary">
        <div><dt>Размер</dt><dd id="order-size"></dd></div>
        <div><dt>Итого</dt><dd>3 600 ₽</dd></div>
      </dl>
      <form class="checkout" id="checkout-form">
        <label for="email">Электронная почта</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="mail@example.ru" aria-describedby="email-help" required>
        <button class="primary" type="submit" data-action="preview-order">Проверить заказ</button>
        <p id="email-help" class="field-help">Демо-режим. Данные проверяются в браузере.</p>
        <p class="checkout-status" id="checkout-status" role="status" hidden></p>
      </form>
    </dialog>
  </main>
  <script>
const intro = document.querySelector('.intro');
const buyButton = document.querySelector('[data-action="buy"]');
const order = document.getElementById('order');
const orderSize = document.getElementById('order-size');
const checkoutForm = document.getElementById('checkout-form');
const checkoutStatus = document.getElementById('checkout-status');
const photos = document.querySelectorAll('#gallery-frame .product-photo');
const photoArrows = document.querySelectorAll('#product-gallery [data-photo-step]');
let photoIndex = 0;

document.addEventListener('focusin', () => intro.remove(), { once: true });
intro.addEventListener('animationend', (event) => {
  if (event.target === intro) intro.remove();
});

for (const arrow of photoArrows) {
  arrow.addEventListener('click', () => {
    photos[photoIndex].setAttribute('aria-hidden', 'true');
    const step = Number(arrow.dataset.photoStep);
    photoIndex = (photoIndex + step + photos.length) % photos.length;
    photos[photoIndex].removeAttribute('aria-hidden');
  });
}

buyButton.addEventListener('click', () => {
  orderSize.textContent = document.querySelector('.size-options input:checked').value;
  checkoutStatus.hidden = true;
  order.showModal();
});

document.getElementById('order-close').addEventListener('click', () => order.close());

checkoutForm.addEventListener('input', () => {
  checkoutStatus.hidden = true;
});

checkoutForm.addEventListener('submit', (event) => {
  event.preventDefault();
  checkoutStatus.textContent = 'Данные проверены. Сумма заказа — 3 600 ₽.';
  checkoutStatus.hidden = false;
});
  </script>
</body>
</html>
